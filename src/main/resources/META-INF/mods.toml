[[mods]]
modId="isleofberkdeadlockfix"
version="${version}"
displayName="Isle of Berk Deadlock Fix"
description='''
Prevents Isle of Berk chunk-generation deadlocks caused by ADragonBase.isWaterBelow() being
called from worldgen-context spawn rules. This regular artifact targets Isle of Berk only;
the optional Variant Loader adapter is built separately and is not included here.
'''
authors="Vonix-Network"

