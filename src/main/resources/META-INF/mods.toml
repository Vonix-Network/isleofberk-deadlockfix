[[mods]]
modId="isleofberkdeadlockfix"
version="1.0.0"
displayName="Isle of Berk Deadlock Fix"
description='''
Prevents chunk-generation deadlocks caused by Isle of Berk's ADragonBase.isWaterBelow() being
called from worldgen-context spawn rules. Short-circuits the cross-chunk read when invoked off
the main server thread (worldgen worker threads).
'''
authors="Vonix-Network / Hermes Agent (Claude Opus 4.7)"

