[[mods]]
modId="isleofberkdeadlockfix"
version="${version}"
displayName="Isle of Berk Deadlock Fix"
description='''
Prevents Isle of Berk chunk-generation deadlocks caused by ADragonBase.isWaterBelow() being
called from worldgen-context spawn rules. When Isle of Berk Variant Loader 2.6.4 is present,
it also prevents its alternative follow goal from ticking a dragon after its owner is unavailable.
The Variant Loader target is optional and is loaded through a separate soft-required mixin configuration.
'''
authors="Vonix-Network"

[[dependencies.isleofberkdeadlockfix]]
modId="forge"
mandatory=true
versionRange="[40,)"
ordering="NONE"
side="BOTH"

[[dependencies.isleofberkdeadlockfix]]
