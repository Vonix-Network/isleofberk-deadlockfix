[[mods]]
modId="isleofberkdeadlockfix"
version="${version}"
displayName="IOB Deadlock Fixes"
description='''
Prevents two Isle of Berk server crashes:

1. A chunk-generation deadlock from ADragonBase.isWaterBelow() being called from
   worldgen-context spawn rules (ServerHangWatchdog, "a single server tick took 60.00 seconds").
2. A NullPointerException while ticking a tamed dragon whose owner is not resolvable
   (LookControl.setLookAt(null)), caused by IoB Variant Loader's AltFollowGoal. The
   Variant Loader guard is optional and inactive when IoB Variant Loader is not installed.
'''
authors="Vonix-Network"

[[dependencies.isleofberkdeadlockfix]]
modId="forge"
mandatory=true
versionRange="[40,)"
ordering="NONE"
side="BOTH"

[[dependencies.isleofberkdeadlockfix]]
