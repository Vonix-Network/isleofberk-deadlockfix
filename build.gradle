plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'network.vonix.isleofberkdeadlockfix'
archivesBaseName = 'isleofberk-deadlockfix'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkdeadlockfix { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkdeadlockfix { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'isleofberkdeadlockfix.refmap.json'
    config 'isleofberkdeadlockfix.mixins.json'
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.0'
    // Reference the Isle of Berk jar so mixin can resolve the target class
    compileOnly fileTree(dir: 'libs', include: ['isleofberk-1.2.0.jar'])
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "isleofberk-deadlockfix",
            "Specification-Vendor"    : "Vonix-Network",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Vonix-Network",
            "MixinConfigs"            : "isleofberkdeadlockfix.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')
