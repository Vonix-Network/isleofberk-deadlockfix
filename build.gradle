plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '5.1.77'
    id 'org.spongepowered.mixin' version '0.7.38'
}

def forgeVersion = project.findProperty('forgeVersion') ?: '40.3.0'

version = project.findProperty('version') ?: '1.2.0'
group = 'network.vonix.isleofberkdeadlockfix'
archivesBaseName = 'isleofberk-deadlockfix'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkdeadlockfix { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkdeadlockfix { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'isleofberkdeadlockfix.refmap.json'
    config 'isleofberkdeadlockfix.mixins.json'
    config 'isleofberkdeadlockfix.variant.mixins.json'
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.18.2-${forgeVersion}"

    // These upstream jars are developer-supplied compile-only references and
    // are never embedded in the published companion artifact.
    compileOnly fileTree(dir: 'libs', include: [
            'isleofberk-1.2.0.jar',
            'iobvariantloader-2.7.0-all.jar',
            'geckolib-forge-1.18-3.0.57.jar'
    ])

    // Local userdev boot dependencies. ForgeGradle's deobf wrapper is required
    // because the downloaded files are production-obfuscated Forge jars.
    runtimeOnly fg.deobf('local:isleofberk-1.2.0:1.2.0')
    runtimeOnly fg.deobf('local:geckolib-forge-1.18-3.0.57:3.0.57')
    // Optional Variant Loader runtime reference for the packaged-runtime gate.
    runtimeOnly fg.deobf('local:iobvariantloader-2.7.0-all:2.7.0')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def replaceProperties = [version: project.version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    doLast {
        fileTree(destinationDir).matching { include 'META-INF/mods.toml' }.each { resource ->
            def content = resource.getText('UTF-8')
            content += '''

[[dependencies.isleofberkdeadlockfix]]
modId="iobvariantloader"
mandatory=false
versionRange="[2.6.4,)"
ordering="AFTER"
side="BOTH"
'''
            resource.setText(content, 'UTF-8')
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title"     : "isleofberk-deadlockfix",
            "Specification-Vendor"    : "Vonix-Network",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Vonix-Network",
            "MixinConfigs"            : "isleofberkdeadlockfix.mixins.json,isleofberkdeadlockfix.variant.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')
