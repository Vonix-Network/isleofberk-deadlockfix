plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '5.1.77'
    id 'org.spongepowered.mixin' version '0.7.38'
}

def forgeVersion = project.findProperty('forgeVersion') ?: '40.3.12'
def includeVariantLoader = project.findProperty('includeVariantLoader')?.toBoolean() ?: true
version = project.findProperty('version') ?: '1.0.2'
group = 'network.vonix.isleofberkdeadlockfix'
archivesBaseName = 'isleofberk-deadlockfix'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkdeadlockfix { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { isleofberkdeadlockfix { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'isleofberkdeadlockfix.refmap.json'
    config 'isleofberkdeadlockfix.mixins.json'
    config 'isleofberkdeadlockfix.variant.mixins.json'
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.18.2-${forgeVersion}"
    compileOnly fileTree(dir: 'libs', include: ['isleofberk-1.2.0.jar', 'iobvariantloader-2.7.0-all.jar', 'geckolib-forge-1.18-3.0.57.jar'])
    runtimeOnly fg.deobf('local:isleofberk-1.2.0:1.2.0')
    runtimeOnly fg.deobf('local:geckolib-forge-1.18-3.0.57:3.0.57')
    if (includeVariantLoader) { runtimeOnly fg.deobf('local:iobvariantloader-2.7.0-all:2.7.0') }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def replaceProperties = [version: project.version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "isleofberk-deadlockfix",
            "Specification-Vendor"    : "Vonix-Network",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Vonix-Network",
            "MixinConfigs"            : "isleofberkdeadlockfix.mixins.json,isleofberkdeadlockfix.variant.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')
