name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fetch pinned compile-only target jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 --output libs/isleofberk-1.2.0.jar \
            https://cdn.modrinth.com/data/o14djL4t/versions/hULU5MTd/isleofberk-1.2.0.jar
          curl --fail --location --retry 3 --output libs/geckolib-forge-1.18-3.0.57.jar \
            https://cdn.modrinth.com/data/8BmcQJ2H/versions/wwh0ZFLu/geckolib-forge-1.18-3.0.57.jar
          curl --fail --location --retry 3 --output libs/iobvariantloader-2.7.0-all.jar \
            https://cdn.modrinth.com/data/XepXTAL4/versions/ziMv9NEf/iobvariantloader-2.7.0-all.jar

          cat > /tmp/iob-sha512sums <<'EOF'
          54e381796806264db009ace6dbe7a3d220bea54c301d131392b0ef723a4601cc33149e86d246782fc99c8cda6b1c242760df83eb52fff7eca01217fc4ad2463e  libs/isleofberk-1.2.0.jar
          4780298cdd2d5551ef8cf4d5b4ff20744f0c2ba9ae0ff45e1030fb5c91b351e650fd8550798396203f0c95944eeda695c93a07748895637c6b6710ea5419350c  libs/geckolib-forge-1.18-3.0.57.jar
          4c325579a976558e308f252771531e5ea5fa60103e609ccaa7545fcf2863a6ac47b1d4323afd3d057a751786d3ddaa197b6b9bba33669e15b08a9fdd4e538497  libs/iobvariantloader-2.7.0-all.jar
          EOF
          sha512sum -c /tmp/iob-sha512sums

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/isleofberk-deadlockfix-*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          test -s "$jar"
          unzip -t "$jar" >/dev/null
          unzip -p "$jar" META-INF/mods.toml | grep -q 'modId="isleofberkdeadlockfix"'
          unzip -Z1 "$jar" | grep -q '^isleofberkdeadlockfix.mixins.json$'
          unzip -Z1 "$jar" | grep -q '^isleofberkdeadlockfix.variant.mixins.json$'
          unzip -Z1 "$jar" | grep -q 'isleofberkdeadlockfix.refmap.json'
          unzip -Z1 "$jar" | grep -q 'network/vonix/isleofberkdeadlockfix/mixin/ADragonBaseMixin.class'
          unzip -Z1 "$jar" | grep -q 'network/vonix/isleofberkdeadlockfix/mixin/AltFollowGoalMixin.class'
          ! unzip -Z1 "$jar" | grep -E '(^|/)(com/GACMD|nordmods|software/bernie)' >/dev/null
          manifest_configs="$(unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | awk '
            /^MixinConfigs:/ { sub(/^MixinConfigs:[[:space:]]*/, ""); value=$0; next }
            /^[[:space:]]/ { sub(/^[[:space:]]+/, ""); value=value $0; next }
            { if (value != "") { print value; value="" } }
            END { if (value != "") print value }
          ')"
          manifest_configs="${manifest_configs// /}"
          grep -Fqx 'isleofberkdeadlockfix.mixins.json,isleofberkdeadlockfix.variant.mixins.json' <<<"$manifest_configs"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            [[ "$jar" == *"-${tag}.jar" ]]
            unzip -p "$jar" META-INF/mods.toml | grep -q "version=\"${tag}\""
          fi
          sha256sum "$jar" | tee artifact.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            build/libs/*.jar
            artifact.sha256
          generate_release_notes: true
